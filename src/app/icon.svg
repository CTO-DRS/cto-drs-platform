<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2ff0"/>
      <stop offset=".45" stop-color="#2b3fe0"/>
      <stop offset="1" stop-color="#19a8f2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#g)"/>

  <!-- glass waves -->
  <path d="M0 58 C 26 38, 52 34, 78 46 C 100 56, 116 54, 128 48 L128 74 C 108 80, 88 80, 66 72 C 42 63, 20 64, 0 74 Z" fill="url(#wave)" opacity=".85"/>
  <path d="M0 74 C 24 64, 46 64, 70 73 C 94 82, 114 80, 128 74 L128 88 C 106 94, 84 92, 62 84 C 40 76, 20 78, 0 88 Z" fill="#ffffff" opacity=".14"/>

  <!-- top sheen -->
  <rect width="128" height="128" rx="29" fill="url(#sheen)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="3"/>

  <!-- brand letter -->
  <text x="57" y="96" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-3">D</text>

  <!-- signature update dot -->
  <circle cx="95" cy="31" r="14" fill="url(#glow)"/>
  <circle cx="95" cy="31" r="6.5" fill="#ffffff"/>
</svg>
